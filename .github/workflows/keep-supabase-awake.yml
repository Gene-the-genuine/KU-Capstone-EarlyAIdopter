# Supabase 무료 플랜은 7일 동안 DB 사용이 적으면 프로젝트를 일시정지합니다.
# 이 작업은 하루에 한 번 배포된 앱의 /api/health 를 불러서 DB 조회를 1번 일으킵니다.
#
# 켜는 방법 (배포 후 한 번만):
#   GitHub 저장소 → Settings → Secrets and variables → Actions → Variables 탭
#   → New repository variable: 이름 HEALTH_URL, 값 https://<배포주소>/api/health
# HEALTH_URL 이 없으면 아무것도 하지 않고 끝납니다.
# (참고: 저장소에 60일 동안 커밋이 없으면 GitHub 가 예약 작업을 자동으로 멈춥니다)

name: Supabase 일시정지 방지

on:
  schedule:
    - cron: "0 0 * * *" # 매일 UTC 00:00 = 한국 09:00
  workflow_dispatch: # Actions 탭에서 직접 실행도 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: /api/health 호출
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "HEALTH_URL 변수가 없어 건너뜁니다. (README.md 'Supabase 무료 플랜 주의사항' 참고)"
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 "$HEALTH_URL"
