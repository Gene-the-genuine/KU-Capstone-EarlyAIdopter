<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A. 상담사 로그인 (/login)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = { theme: { extend: {
  fontFamily: { sans: ['"IBM Plex Sans KR"', '"Apple SD Gothic Neo"', '"Malgun Gothic"', 'sans-serif'] },
  colors: {
    canvas: '#F5F7F6', surface: '#FFFFFF', ink: '#1E2925', muted: '#5B6862', line: '#DFE5E2',
    brand: { DEFAULT: '#2E6A5C', hover: '#25574B', soft: '#E7F1EE' },
    draft: { DEFAULT: '#9A5B0B', soft: '#FDF3E1' },
    danger: { DEFAULT: '#B4321F', soft: '#FCEBE8' }
  } } } };
</script>
<style>[hidden] { display: none !important; }</style>
</head>
<body class="min-h-screen bg-canvas font-sans text-ink antialiased">
<main class="flex min-h-screen items-center justify-center px-4 py-12">
  <div class="w-full max-w-sm">
    <div class="mb-8 text-center">
      <p class="text-sm font-semibold tracking-wide text-brand">회기노트</p>
      <h1 class="mt-2 text-2xl font-bold">상담사 로그인</h1>
      <p class="mt-2 text-sm text-muted">회기 기록을 정리하고 내담자에게 공유하세요.</p>
    </div>

    <form action="dashboard.html" class="space-y-4 rounded-xl border border-line bg-surface p-6 shadow-sm">
      <div class="space-y-1.5">
        <label for="username" class="text-sm font-medium">아이디</label>
        <input id="username" type="text" autocomplete="username" value="counselor01"
          class="h-10 w-full rounded-md border border-line bg-surface px-3 text-sm focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/25">
      </div>
      <div class="space-y-1.5">
        <label for="password" class="text-sm font-medium">비밀번호</label>
        <input id="password" type="password" autocomplete="current-password" value="password"
          class="h-10 w-full rounded-md border border-danger bg-surface px-3 text-sm focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/25">
      </div>

      <!-- 로그인 실패 시에만 표시 -->
      <p role="alert" class="rounded-md bg-danger-soft px-3 py-2 text-sm text-danger">아이디 또는 비밀번호가 올바르지 않습니다.</p>

      <button type="submit" class="inline-flex h-10 w-full items-center justify-center rounded-md bg-brand text-sm font-medium text-white hover:bg-brand-hover focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand">로그인</button>
    </form>

    <p class="mt-6 text-center text-sm text-muted">
      계정이 없으신가요? <a href="signup.html" class="font-medium text-brand underline-offset-4 hover:underline">회원가입</a>
    </p>
    <p class="mt-10 text-center text-xs text-muted">시연용 데모입니다. 실제 상담 정보를 입력하지 마세요.</p>
  </div>
</main>
</body>
</html>
