// 복사 버튼 (실제 구현: navigator.clipboard.writeText + 토스트)
document.getElementById('copy-btn').addEventListener('click', e =&gt; {
  const input = document.getElementById('share-url');
  const done = () =&gt; { e.target.textContent = '복사됨'; setTimeout(() =&gt; e.target.textContent = '복사', 1500); };
  try { navigator.clipboard.writeText(input.value).then(done, () =&gt; { input.select(); }); } catch { input.select(); }
});

// 예시용 QR 모양 그리기 (실제 QR 아님)
(function () {
  const svg = document.getElementById('qr'), n = 25, ns = 'http://www.w3.org/2000/svg';
  let s = 7;
  const rnd = () =&gt; (s = (s * 9301 + 49297) % 233280) / 233280;
  const finder = (x, y, i, j) =&gt; {
    const dx = i - x, dy = j - y;
    if (dx &lt; 0 || dy &lt; 0 || dx &gt; 6 || dy &gt; 6) return null;
    return dx === 0 || dy === 0 || dx === 6 || dy === 6 || (dx &gt;= 2 &amp;&amp; dx &lt;= 4 &amp;&amp; dy &gt;= 2 &amp;&amp; dy &lt;= 4);
  };
  for (let j = 0; j &lt; n; j++) for (let i = 0; i &lt; n; i++) {
    let on = finder(0, 0, i, j);
    if (on === null) on = finder(n - 7, 0, i, j);
    if (on === null) on = finder(0, n - 7, i, j);
    if (on === null) on = rnd() &gt; 0.52;
    if (on) { const r = document.createElementNS(ns, 'rect'); r.setAttribute('x', i); r.setAttribute('y', j); r.setAttribute('width', 1); r.setAttribute('height', 1); r.setAttribute('fill', '#1E2925'); svg.appendChild(r); }
  }
})();
